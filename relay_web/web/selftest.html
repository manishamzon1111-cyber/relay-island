<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network check</title><body style="font-family:system-ui;padding:24px;max-width:600px"><h1>Network isolation checks</h1><p>Independent packet capture is required. Browser failures alone do not prove isolation.</p><p id="status">Testing…</p><script>const targets=['http://1.1.1.1/','http://[2606:4700:4700::1111]/','http://connectivitycheck.gstatic.com/generate_204'];Promise.all(targets.map(async url=>{let s='blocked or unreachable';try{await fetch(url,{mode:'no-cors',signal:AbortSignal.timeout(2500)});s='potentially reachable'}catch{}return url+': '+s})).then(x=>document.getElementById('status').textContent=x.join(' | '))</script></body></html>
